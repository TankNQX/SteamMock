# ============================================================================
#  SteamMock CI
# ----------------------------------------------------------------------------
#  Windows only, because the harness is: the stub is a DLL a game loads by name,
#  and the backend answers it over loopback Winsock. Both architectures are
#  checked, because the stub has to be shaped like the real steam_api.dll for
#  whichever one the game uses.
#
#  Every job runs the full suite: the protocol test, the backend test, the server
#  test, the end-to-end test with the real DLL, and the check that the generated
#  files still match gen/steam_api.idl.json.
#
#  MSVC is the compiler the harness ships with; clang-cl is a second pair of eyes
#  on the same ABI, and it is worth the job because it reports what /W4 cannot.
#
#  The live view lives in its own job because it is the one target that needs the
#  submodules - so the other jobs stay fast and dependency-free.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: windows / msvc / ${{ matrix.arch }} / ${{ matrix.build_type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  warnings:
    name: warnings as errors / msvc / ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022"
          -A ${{ matrix.arch }} -DSTEAMMOCK_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Same ABI as the MSVC job, different compiler - and Clang is the one that can
  # see a constant nobody uses or a name that shadows a member. Needs the "C++
  # Clang Compiler for Windows" toolset, which the windows-2022 image carries.
  clang-cl:
    name: windows / clang-cl / ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022"
          -A ${{ matrix.arch }} -T ClangCL -DSTEAMMOCK_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  format:
    name: clang-format
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check
        shell: pwsh
        run: pwsh -File tools/check-format.ps1

  # The only target that needs the submodules, so only this job checks them out.
  gui:
    name: gui / msvc / x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DSTEAMMOCK_BUILD_GUI=ON -DSTEAMMOCK_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
